<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ meta_title }}</title>
  <meta name="description" content="{{ meta_description }}">
  <link rel="canonical" href="{{ canonical }}">
  <meta name="robots" content="index, follow, max-image-preview:large">
  <meta property="og:site_name" content="{{ brand }}">
  <meta property="og:title" content="{{ meta_title }}">
  <meta property="og:description" content="{{ meta_description }}">
  <meta property="og:url" content="{{ canonical }}">
  <meta property="og:type" content="{% block og_type %}website{% endblock %}">
  {% block og_image %}{% endblock %}
  <meta name="twitter:card" content="summary_large_image">
  {% block head_extra %}{% endblock %}
  <style>
    :root { --ink: #1b2733; --muted: #5b6b7a; --brand: #0b6b4f; --line: #e3e8ee; --bg: #f7f9fb; }
    * { box-sizing: border-box; }
    body { margin: 0; font: 17px/1.75 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; color: var(--ink); background: #fff; }
    a { color: var(--brand); }
    header.top { border-bottom: 1px solid var(--line); background: #fff; }
    .wrap { max-width: 820px; margin: 0 auto; padding: 0 16px; }
    .bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 0; }
    .logo { font-weight: 700; font-size: 20px; text-decoration: none; color: var(--ink); }
    .btn { display: inline-block; background: var(--brand); color: #fff; padding: 10px 18px; border-radius: 8px; text-decoration: none; font-weight: 600; font-size: 15px; }
    nav.crumbs { font-size: 14px; color: var(--muted); margin: 20px 0 4px; }
    nav.crumbs a { color: var(--muted); }
    h1 { font-size: clamp(26px, 5vw, 36px); line-height: 1.25; margin: 8px 0 6px; }
    .meta { color: var(--muted); font-size: 14px; margin-bottom: 24px; }
    .prose h2 { font-size: 25px; margin: 38px 0 8px; line-height: 1.3; }
    .prose h3 { font-size: 20px; margin: 28px 0 6px; }
    .prose img { max-width: 100%; height: auto; border-radius: 8px; }
    .prose table { display: block; overflow-x: auto; border-collapse: collapse; max-width: 100%; }
    .prose th, .prose td { border: 1px solid var(--line); padding: 8px 10px; text-align: left; }
    .prose pre { background: var(--bg); padding: 14px; border-radius: 8px; overflow-x: auto; }
    .prose blockquote { margin: 18px 0; padding: 4px 16px; border-left: 4px solid var(--brand); background: var(--bg); }
    .cta { background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding: 22px; margin: 40px 0; text-align: center; }
    .cta p { margin: 0 0 12px; font-weight: 600; }
    .card { display: block; padding: 14px 0; border-bottom: 1px solid var(--line); text-decoration: none; color: var(--ink); }
    .card span { display: block; color: var(--muted); font-size: 15px; }
    footer { border-top: 1px solid var(--line); color: var(--muted); font-size: 14px; padding: 22px 0 40px; margin-top: 30px; }
  </style>
</head>
<body>
  <header class="top"><div class="wrap bar">
    <a class="logo" href="/">{{ brand }}</a>
    <a class="btn" href="{{ cta_url }}">{{ cta_text }}</a>
  </div></header>
  <main class="wrap">{% block content %}{% endblock %}</main>
  <footer><div class="wrap"><a href="/">{{ brand }}</a> . <a href="/docs">Guides</a></div></footer>
</body>
</html>
